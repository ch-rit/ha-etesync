name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Ruff
        run: |
          uvx ruff@0.17.6 check --output-format=github .
          uvx ruff@0.17.6 format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements_test.txt
      - name: Run tests
        run: .venv/bin/python -m pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  interop:
    # Runs the Etebase client against a real server and the official Rust client.
    name: Etebase interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements_test.txt etebase==0.32.0
      - name: Start Etebase server
        run: |
          ./scripts/run_test_server.sh > server.log 2>&1 &
          for _ in $(seq 120); do
            curl -sf http://127.0.0.1:8033/api/v1/authentication/is_etebase/ >/dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run interop tests
        env:
          ETEBASE_TEST_SERVER: http://127.0.0.1:8033
        run: .venv/bin/python -m pytest tests/etebase -m live_server -v
      - name: Server log
        if: failure()
        run: cat server.log
